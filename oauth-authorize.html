<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Authorize — Kyte Shipyard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script>
        // Load kyte.js: local dev version on localhost, otherwise the CDN.
        (function () {
            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const kyteScript = isLocalhost ? '/assets/js/kyte-dev.js' : 'https://cdn.keyqcloud.com/kyte/js/stable/kyte.js';
            document.write('<script src="' + kyteScript + '"' + (isLocalhost ? '' : ' crossorigin="anonymous"') + '><\/script>');
        })();
    </script>
    <script>
        // Load Shipyard bootstrap (inits _ks + fires KyteInitialized) + the consent logic.
        (function () {
            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const jsPath = isLocalhost ? '/assets/js/source/' : '/assets/js/';
            ['kyte-shipyard.js', 'kyte-shipyard-oauth-consent.js'].forEach(function (s) {
                document.write('<script src="' + jsPath + s + '"><\/script>');
            });
        })();
    </script>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaeaea;
            margin: 0;
        }
        .consent-wrap { width: 100%; max-width: 460px; padding: 20px; }
        .consent-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
            padding: 32px;
        }
        .consent-brand { text-align: center; margin-bottom: 20px; color: #6c5ce7; font-weight: 700; letter-spacing: .5px; }
        .consent-brand i { margin-right: 8px; }
        .consent-title { font-size: 1.35rem; font-weight: 600; text-align: center; margin-bottom: 8px; }
        .consent-sub { color: #666; text-align: center; margin-bottom: 20px; }
        #scope-list { list-style: none; padding: 0; margin: 0 0 24px; }
        #scope-list li {
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #f5f5fb;
            border-radius: 8px;
            font-size: .95rem;
            color: #333;
        }
        #scope-list li::before { content: "\f00c"; font-family: "Font Awesome 6 Free"; font-weight: 900; color: #6c5ce7; margin-right: 10px; }
        .consent-actions { display: flex; gap: 12px; }
        .consent-actions .btn { flex: 1; padding: 10px; font-weight: 600; }
        .btn-authorize { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }
        .btn-authorize:hover { background: #5a4bd1; border-color: #5a4bd1; color: #fff; }
        .consent-foot { text-align: center; color: #999; font-size: .8rem; margin-top: 18px; }
    </style>
</head>
<body>
    <div class="consent-wrap">
        <div class="consent-brand"><i class="fas fa-rocket"></i>Kyte Shipyard</div>
        <div class="consent-card">

            <!-- Loading -->
            <div id="consent-loading" class="text-center py-4">
                <div class="spinner-border" role="status" style="color:#6c5ce7;"><span class="visually-hidden">Loading…</span></div>
                <div class="mt-3 text-muted">Loading authorization request…</div>
            </div>

            <!-- Consent -->
            <div id="consent-card" class="d-none">
                <div class="consent-title">Authorize <span id="client-name">the application</span> to access Kyte</div>
                <p class="consent-sub"><span id="client-name-2"></span>is requesting access to your Kyte account. It will be able to:</p>
                <ul id="scope-list"></ul>
                <div class="consent-actions">
                    <button id="btn-cancel" type="button" class="btn btn-outline-secondary">Cancel</button>
                    <button id="btn-authorize" type="button" class="btn btn-authorize">Authorize</button>
                </div>
                <div class="consent-foot">You can revoke this access anytime from your Kyte tokens.</div>
            </div>

            <!-- Error -->
            <div id="consent-error" class="d-none text-center py-3">
                <i class="fas fa-triangle-exclamation fa-2x mb-3" style="color:#ff6f61;"></i>
                <div class="error-text text-muted"></div>
                <a href="/app/" class="btn btn-outline-secondary mt-3">Back to Shipyard</a>
            </div>

        </div>
    </div>
</body>
</html>
